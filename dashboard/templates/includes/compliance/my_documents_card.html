<div class="dashboard-card dashboard-mydocs-card" id="myDocumentsCard">
  <div class="dashboard-table-header">
    <div class="dashboard-table-title">
      My Documents
      <span class="dashboard-notification-badge" id="myDocumentsBadge" style="display:none;">0</span>
    </div>
  </div>

  <div class="dashboard-mydocs-stats" id="myDocumentsStats">
    <div class="dashboard-mydocs-stat">
      <span class="dashboard-mydocs-stat-value" id="myDocumentsOutstanding">—</span>
      <span class="dashboard-mydocs-stat-label">Outstanding</span>
    </div>
    <div class="dashboard-mydocs-stat dashboard-mydocs-stat-overdue" id="myDocumentsOverdueStat">
      <span class="dashboard-mydocs-stat-value" id="myDocumentsOverdue">—</span>
      <span class="dashboard-mydocs-stat-label">Overdue</span>
    </div>
    <div class="dashboard-mydocs-stat">
      <span class="dashboard-mydocs-stat-value" id="myDocumentsCompleted">—</span>
      <span class="dashboard-mydocs-stat-label">Completed</span>
    </div>
  </div>

  <div class="dashboard-mydocs-next-due" id="myDocumentsNextDueWrap" style="display:none;">
    Next due: <strong id="myDocumentsNextDue">—</strong>
  </div>

  <div class="dashboard-mydocs-uptodate" id="myDocumentsUpToDate" style="display:none;">
    All documents complete
  </div>

  <a class="dashboard-btn dashboard-btn-primary dashboard-mydocs-btn" href="/coach-documents">View My Documents</a>
</div>
