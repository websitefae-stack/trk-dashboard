<div id="notificationDetailsRoot">
  <div class="dashboard-notice" id="notificationDetailsNotice">
    Loading notification...
  </div>

  <div class="dashboard-detail-form" id="notificationDetailsContent" style="display:none;">

    <div class="dashboard-detail-section">
      <div class="dashboard-detail-section-head notification-collapsible-head">
        <div>
          <h2 class="dashboard-detail-section-title" id="notificationTitleText">Notification</h2>

          <div class="dashboard-notification-pill-row" style="margin-top:10px;">
            <span class="dashboard-priority-pill" id="notificationPriorityText">Normal</span>
            <span class="dashboard-status-pill" id="notificationStatusText">Open</span>
          </div>
        </div>

        <div class="dashboard-detail-actions">
          <button type="button" class="dashboard-btn dashboard-btn-light" id="toggleNotificationDetails">
            Hide Details
          </button>

          <button type="button" class="dashboard-btn notification-archive-btn" id="archiveNotificationBtn" style="display:none;">
            Archive Conversation
          </button>
        </div>
      </div>

      <input type="hidden" id="notificationDocname" value="{{ notification_docname or '' }}">

      <div id="notificationDetailsMeta" class="dashboard-detail-grid notification-detail-grid-compact">
        <div class="dashboard-detail-field">
          <label>Type</label>
          <div class="dashboard-html-block" id="notificationTypeText">—</div>
        </div>

        <div class="dashboard-detail-field">
          <label>Created By</label>
          <div class="dashboard-html-block" id="notificationCreatedByText">—</div>
        </div>

        <div class="dashboard-detail-field">
          <label>Created Date</label>
          <div class="dashboard-html-block" id="notificationCreatedDateText">—</div>
        </div>

        <div class="dashboard-detail-field">
          <label>Due Date</label>
          <div class="dashboard-html-block" id="notificationDueDateText">—</div>
        </div>

        <div class="dashboard-detail-field">
          <label>Requires Response</label>
          <div class="dashboard-html-block" id="notificationRequiresResponseText">—</div>
        </div>

        <div class="dashboard-detail-field">
          <label>Linked Client</label>
          <div class="dashboard-html-block" id="notificationLinkedClientText">—</div>
        </div>

        <div class="dashboard-detail-field">
          <label>Linked Session/Event</label>
          <div class="dashboard-html-block" id="notificationLinkedEventText">—</div>
        </div>

        <div class="dashboard-detail-field dashboard-detail-field-full">
          <label>Recipients</label>
          <div id="notificationRecipientsSummary"></div>
        </div>
      </div>
    </div>

    <div class="dashboard-detail-section">
      <div class="dashboard-detail-section-head">
        <h2 class="dashboard-detail-section-title">Original Message</h2>
      </div>

      <div class="dashboard-html-block" id="notificationMessageText">—</div>
    </div>

    <div class="dashboard-detail-section">
      <div class="dashboard-detail-section-head">
        <h2 class="dashboard-detail-section-title">Conversation Thread</h2>
      </div>

      <div id="notificationTimeline"></div>
    </div>

    <div class="dashboard-detail-section" id="notificationReplySection">
      <div class="dashboard-detail-section-head">
        <h2 class="dashboard-detail-section-title">Reply</h2>
      </div>

      <div class="dashboard-detail-field">
        <label for="notificationReplyText">Your Reply</label>
        <textarea
          id="notificationReplyText"
          class="dashboard-textarea"
          placeholder="Write your reply..."
        ></textarea>
      </div>

      <div class="dashboard-detail-field">
        <label for="notificationReplyAttachment">Attachment URL</label>
        <input
          id="notificationReplyAttachment"
          class="dashboard-input"
          placeholder="Optional attachment URL"
        >
      </div>

      <div class="dashboard-detail-actions">
        <button type="button" class="dashboard-btn dashboard-btn-primary" id="sendNotificationReplyBtn">
          Send Reply
        </button>
      </div>
    </div>

  </div>
</div>
