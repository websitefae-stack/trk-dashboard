<div class="dashboard-container">

  <input type="hidden" id="csrfToken" value="{{ frappe.session.csrf_token }}">
  <input type="hidden" id="invoiceDocname" value="{{ doc.name or '' }}">
  <input type="hidden" id="invoiceDocstatus" value="{{ doc.docstatus or 0 }}">
  <input type="hidden" id="invoice_status" value="{{ doc.status or 'Draft' }}">
  <input type="hidden" id="invoice_contact_email_hidden" value="{{ contact_email or '' }}">
  <input type="hidden" id="coachPhoneValue" value="{{ current_user_phone or '' }}">

  <script id="invoiceInitialItems" type="application/json">
    {{ initial_items_json or "[]" }}
  </script>

  <script id="invoiceInitialClientDefaults" type="application/json">
    {{ initial_client_defaults_json or "{}" }}
  </script>

  <div class="dashboard-page-header">
    <div>
      <h1 class="dashboard-page-title" id="invoicePageTitle">
        {{ doc.name or "New Invoice" }}
      </h1>

      <p class="dashboard-page-subtitle">
        Create and manage invoices
      </p>
    </div>

    <div class="dashboard-page-actions">

      <span
        id="invoiceStatusBadge"
        class="dashboard-badge {% if doc.status == 'Paid' %}dashboard-status-active{% elif doc.docstatus == 0 %}dashboard-status-onhold{% else %}dashboard-status-archived{% endif %}"
      >
        {{ doc.status or "Draft" }}
      </span>

      <a
        href="{{ dashboard_base_path }}/invoices"
        class="dashboard-btn dashboard-btn-light"
      >
        Back to Invoices
      </a>

      <button
        type="button"
        class="dashboard-btn dashboard-btn-light"
        id="openEmailInvoice"
        {% if doc.docstatus != 1 %}style="display:none;"{% endif %}
      >
        Email Invoice
      </button>

      <button
        type="button"
        class="dashboard-btn dashboard-btn-light"
        id="saveInvoiceDraft"
        {% if doc.docstatus != 0 %}style="display:none;"{% endif %}
      >
        Save Draft
      </button>

      <button
        type="button"
        class="dashboard-btn"
        id="submitInvoice"
        {% if doc.docstatus != 0 %}style="display:none;"{% endif %}
      >
        Submit Invoice
      </button>

    </div>
  </div>

  <div
    id="openPackageWarning"
    class="dashboard-alert dashboard-alert-warning"
    hidden
    style="margin-bottom:20px;"
  ></div>

  <div class="dashboard-grid dashboard-grid-2">

    <div class="dashboard-card">

      <div class="dashboard-card-header">
        <h3 class="dashboard-card-title">Invoice Details</h3>
      </div>

      <div class="dashboard-form-grid">

        <div class="dashboard-form-field">
          <label>Invoice Number</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_name"
            value="{{ doc.name or '' }}"
            readonly
          >
        </div>

        <div class="dashboard-form-field">
          <label>Status</label>

          <input
            type="text"
            class="dashboard-input"
            value="{{ doc.status or 'Draft' }}"
            readonly
          >
        </div>

        <div class="dashboard-form-field">
          <label>Posting Date</label>

          <input
            type="date"
            class="dashboard-input"
            id="invoice_posting_date"
            value="{{ doc.posting_date or '' }}"
            readonly
          >
        </div>

        <div class="dashboard-form-field">
          <label>Due Date</label>

          <input
            type="date"
            class="dashboard-input"
            id="invoice_due_date"
            data-invoice-field="1"
            value="{{ doc.due_date or '' }}"
          >
        </div>

        <div class="dashboard-form-field">
          <label>Naming Series</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_naming_series"
            value="{{ doc.naming_series or '' }}"
            readonly
          >
        </div>

      </div>
    </div>

    <div class="dashboard-card">

      <div class="dashboard-card-header">
        <h3 class="dashboard-card-title">Billing Information</h3>
      </div>

      <div class="dashboard-form-grid">

        <div class="dashboard-form-field">
          <label>Client</label>

          <select
            class="dashboard-select"
            id="invoice_custom_client"
            data-link-doctype="Client"
            data-current-value="{{ doc.custom_client or '' }}"
            data-invoice-field="1"
          >
            <option value=""></option>
          </select>
        </div>

        <div class="dashboard-form-field">
          <label>Billing Contact</label>

          <select
            class="dashboard-select"
            id="invoice_customer"
            data-link-doctype="Customer"
            data-current-value="{{ doc.customer or '' }}"
            data-invoice-field="1"
          >
            <option value=""></option>
          </select>
        </div>

        <div class="dashboard-form-field">
          <label>Company</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_company"
            value="{{ company_label or '' }}"
            readonly
          >
        </div>

        <div class="dashboard-form-field">
          <label>Price List</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_price_list"
            value="{{ price_list or '' }}"
            readonly
          >
        </div>

        <div class="dashboard-form-field">
          <label>Coach</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_coach_label"
            value="{{ coach_label or '' }}"
            readonly
          >
        </div>

        <div class="dashboard-form-field">
          <label>Contact Email</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_contact_email"
            value="{{ contact_email or '' }}"
            readonly
          >
        </div>

      </div>

      <div class="dashboard-form-field" style="margin-top:20px;">
        <label>Bank Details</label>

        <textarea
          class="dashboard-textarea"
          id="invoice_bank_display"
          rows="4"
          readonly
        >{{ bank_display_text or '' }}</textarea>
      </div>

    </div>

  </div>

  <div class="dashboard-card" style="margin-top:24px;">

    <div class="dashboard-table-header">

      <div>
        <h3 class="dashboard-card-title">Invoice Items</h3>
      </div>

      <div>
        <button
          type="button"
          class="dashboard-btn dashboard-btn-light"
          id="addInvoiceItem"
        >
          Add Item
        </button>
      </div>

    </div>

    <div class="dashboard-table-wrap">

      <table class="dashboard-table">

        <thead>
          <tr>
            <th style="width:180px;">Item</th>
            <th>Description</th>
            <th style="width:120px;">Qty</th>
            <th style="width:140px;">Rate</th>
            <th style="width:140px;">Amount</th>
            <th style="width:120px;"></th>
          </tr>
        </thead>

        <tbody id="invoiceItemsBody"></tbody>

      </table>

    </div>

  </div>

  <div class="dashboard-grid dashboard-grid-2" style="margin-top:24px;">

    <div class="dashboard-card">

      <div class="dashboard-card-header">
        <h3 class="dashboard-card-title">Notes</h3>
      </div>

      <div class="dashboard-form-field">

        <textarea
          class="dashboard-textarea"
          rows="8"
          placeholder="Additional invoice notes..."
          readonly
        ></textarea>

      </div>

    </div>

    <div class="dashboard-card">

      <div class="dashboard-card-header">
        <h3 class="dashboard-card-title">Totals</h3>
      </div>

      <div class="dashboard-form-grid">

        <div class="dashboard-form-field">
          <label>Grand Total</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_grand_total"
            value="{{ doc.grand_total or 0 }}"
            readonly
          >
        </div>

        <div class="dashboard-form-field">
          <label>Outstanding Amount</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_outstanding_amount"
            value="{{ doc.outstanding_amount or 0 }}"
            readonly
          >
        </div>

        <div class="dashboard-form-field">
          <label>Paid Amount</label>

          <input
            type="text"
            class="dashboard-input"
            id="invoice_paid_amount"
            value="{{ doc.paid_amount or 0 }}"
            readonly
          >
        </div>

      </div>

    </div>

  </div>

</div>

<div
  id="invoiceEmailModal"
  class="dashboard-modal"
  hidden
  style="display:none;"
>

  <div class="dashboard-modal-card">

    <div class="dashboard-modal-header">

      <h3>Email Invoice</h3>

      <button
        type="button"
        class="dashboard-btn dashboard-btn-light"
        id="closeInvoiceEmailModal"
      >
        Close
      </button>

    </div>

    <div class="dashboard-form-grid">

      <div class="dashboard-form-field">
        <label>Recipient</label>

        <input
          type="email"
          class="dashboard-input"
          id="emailRecipient"
          value="{{ contact_email or '' }}"
        >
      </div>

      <div class="dashboard-form-field">
        <label>Reply To</label>

        <input
          type="email"
          class="dashboard-input"
          id="emailReplyTo"
          value="{{ current_user_email or '' }}"
        >
      </div>

      <div class="dashboard-form-field dashboard-form-field-full">
        <label>Subject</label>

        <input
          type="text"
          class="dashboard-input"
          id="emailSubject"
        >
      </div>

      <div class="dashboard-form-field dashboard-form-field-full">
        <label>Message</label>

        <textarea
          class="dashboard-textarea"
          rows="12"
          id="emailMessage"
        ></textarea>
      </div>

    </div>

    <div
      class="dashboard-page-actions"
      style="margin-top:20px;justify-content:flex-end;"
    >

      <button
        type="button"
        class="dashboard-btn"
        id="sendInvoiceEmail"
      >
        Send Email
      </button>

    </div>

  </div>

</div>
