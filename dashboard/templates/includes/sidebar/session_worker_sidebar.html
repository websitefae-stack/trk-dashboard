<header class="dashboard-mobile-header">
    <div class="dashboard-mobile-header-row">
        <button class="dashboard-menu-toggle" type="button" aria-label="Open menu">
            ☰
        </button>

        <div class="dashboard-mobile-brand">Session Worker Dashboard</div>
    </div>
</header>

<div class="dashboard-sidebar-overlay"></div>

<aside class="dashboard-sidebar">
    <div class="dashboard-sidebar-header">
        <div class="dashboard-logo">Session Worker Dashboard</div>

        <button class="dashboard-sidebar-close" type="button" aria-label="Close menu">
            ×
        </button>
    </div>

    <nav class="dashboard-nav">
        <a href="/session_worker_db" class="{% if active_page == 'dashboard' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">⌂</span>
            <span>Dashboard</span>
        </a>

        <a href="/session_worker_db/notifications"
           class="dashboard-nav-notification-link {% if active_page == 'notifications' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">🔔</span>
            <span>Notifications</span>
            <span class="dashboard-notification-badge js-notification-badge" style="display:none;">0</span>
        </a>

        <a href="/session_worker_db/clients" class="{% if active_page == 'clients' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">👥</span>
            <span>Clients</span>
        </a>

        <a href="/session_worker_db/contacts" class="{% if active_page == 'contacts' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">📇</span>
            <span>Contacts</span>
        </a>

        <a href="/session_worker_db/calendar" class="{% if active_page == 'calendar' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">📅</span>
            <span>Calendar</span>
        </a>

        <a href="/session_worker_db/profile" class="{% if active_page == 'profile' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">⚙️</span>
            <span>Account</span>
        </a>

        <button type="button" id="dashboardLogoutBtn" class="dashboard-sidebar-logout">
            <span class="dashboard-nav-icon">⎋</span>
            <span>Log Out</span>
        </button>
    </nav>
</aside>
