<header class="dashboard-mobile-header">
    <div class="dashboard-mobile-header-row">
        <button class="dashboard-menu-toggle" type="button" aria-label="Open menu">
            ☰
        </button>

        <div class="dashboard-mobile-brand">Franchisor Dashboard</div>
    </div>
</header>

<div class="dashboard-sidebar-overlay"></div>

<aside class="dashboard-sidebar">
    <div class="dashboard-sidebar-header">
        <div class="dashboard-logo">Franchisor Dashboard</div>

        <button class="dashboard-sidebar-close" type="button" aria-label="Close menu">
            ×
        </button>
    </div>

    <nav class="dashboard-nav">
        <a href="/franchisor_db" class="{% if active_page == 'dashboard' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">⌂</span>
            <span>Dashboard</span>
        </a>

        <a href="/franchisor_db/notifications"
           class="dashboard-nav-notification-link {% if active_page == 'notifications' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">🔔</span>
            <span>Notifications</span>
            <span class="dashboard-notification-badge js-notification-badge" style="display:none;">0</span>
        </a>

        <a href="/franchisor_db/clients" class="{% if active_page == 'clients' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">👥</span>
            <span>Clients</span>
        </a>

        <a href="/franchisor_db/contacts" class="{% if active_page == 'contacts' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">📇</span>
            <span>Contacts</span>
        </a>

        <a href="/franchisor_db/leads" class="{% if active_page == 'leads' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">📞</span>
            <span>Leads</span>
        </a>

        <a href="/franchisor_db/calendar" class="{% if active_page == 'calendar' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">📅</span>
            <span>Calendar</span>
        </a>

        <a href="/franchisor_db/coaches" class="{% if active_page == 'coaches' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">🎓</span>
            <span>Coaches</span>
        </a>

        <a href="/franchisor_db/session_workers" class="{% if active_page == 'session_workers' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">🧑‍🏫</span>
            <span>Session Workers</span>
        </a>

        <a href="/franchisor_db/item_access" class="{% if active_page == 'item_access' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">🔑</span>
            <span>Item Access</span>
        </a>

        <a href="/franchisor_db/invoices" class="{% if active_page == 'invoices' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">🧾</span>
            <span>Invoices</span>
        </a>

        <a href="/franchisor_db/reports" class="{% if active_page == 'reports' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">🩺</span>
            <span>Reports</span>
        </a>

        <a href="/franchisor_db/documents" class="{% if active_page == 'documents' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">📄</span>
            <span>Documents</span>
        </a>

        <a href="/franchisor_db/profile" class="{% if active_page == 'profile' %}is-active{% endif %}">
            <span class="dashboard-nav-icon">⚙️</span>
            <span>Profile</span>
        </a>
                
        <button type="button" id="dashboardLogoutBtn" class="dashboard-sidebar-logout">
            <span class="dashboard-nav-icon">⎋</span>
            <span>Log Out</span>
        </button>
    </nav>
</aside>
