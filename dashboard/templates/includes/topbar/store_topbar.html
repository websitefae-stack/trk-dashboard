<div class="dashboard-topbar">
    <div class="dashboard-topbar-main">

        <div class="dashboard-topbar-welcome">
            Welcome{% if dashboard_user_name %},
            <span class="dashboard-topbar-name">{{ dashboard_user_name }}</span>
            {% else %}
            <span class="dashboard-topbar-name">{{ frappe.session.user }}</span>
            {% endif %}
        </div>

        {% if is_franchisor_user() %}
        <div class="dashboard-topbar-actions">
            <a href="/franchisor_db" class="dashboard-btn dashboard-btn-light dashboard-topbar-portal-link" title="Back to the franchisor dashboard">
                Back to Dashboard
            </a>
        </div>
        {% endif %}

    </div>
</div>
