{% include "dashboard/templates/includes/head/coach_head.html" %}

<div class="dashboard-page">
  {% include "dashboard/templates/includes/sidebar/coach_sidebar.html" %}

  <div class="dashboard-main">
    {% include "dashboard/templates/includes/topbar/shared_topbar.html" %}

    <div class="dashboard-container">

      <div class="dashboard-page-header">
        <h1>{{ notification.notification_type }}</h1>
        <div class="dashboard-detail-actions">
          <a href="/coach_db/notifications" class="dashboard-btn dashboard-btn-light">Back</a>
          <button id="saveNotificationStatus" class="dashboard-btn">Save Status</button>
        </div>
      </div>

      <input type="hidden" id="csrfToken" value="{{ frappe.session.csrf_token }}">
      <input type="hidden" id="notificationDocname" value="{{ notification_docname }}">

      <div class="dashboard-card">
        <div class="dashboard-detail-grid dashboard-detail-grid-2">
          <div>
            <label>Status</label>
            <select id="notificationStatus" class="dashboard-input">
              <option value="Unread" {% if notification.status=="Unread" %}selected{% endif %}>Unread</option>
              <option value="Read" {% if notification.status=="Read" %}selected{% endif %}>Read</option>
              <option value="Archived" {% if notification.status=="Archived" %}selected{% endif %}>Archived</option>
            </select>
          </div>

          <div>
            <label>Priority</label>
            <input class="dashboard-input" value="{{ notification.priority }}" readonly>
          </div>

          <div>
            <label>Message</label>
            <textarea class="dashboard-input" readonly>{{ notification.message }}</textarea>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/assets/dashboard/js/coach/notification_details.js"></script>
