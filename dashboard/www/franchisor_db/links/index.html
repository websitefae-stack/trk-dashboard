{% include "dashboard/templates/includes/head/franchisor_head.html" %}

<div class="dashboard-page" id="linksPage">
  {% include "dashboard/templates/includes/sidebar/franchisor_sidebar.html" %}

  <div class="dashboard-main">
    {% include "dashboard/templates/includes/topbar/shared_topbar.html" %}

    <div class="dashboard-container">

      <div class="dashboard-page-header">
        <div>
          <h1 class="dashboard-page-title">Links</h1>
          <p class="dashboard-page-subtitle">Shareable links for forms and questionnaires you have access to</p>
        </div>
      </div>

      <div class="dashboard-card dashboard-filter-bar">
        <div class="dashboard-filter-field dashboard-filter-search">
          <label for="formLinksSearch">Search links</label>
          <input
            type="text"
            class="dashboard-input"
            id="formLinksSearch"
            placeholder="Search by form name"
          >
        </div>
      </div>

      <div id="formLinksList"></div>

    </div>
  </div>
</div>
